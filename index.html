<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Will you be my Valentine Chiku Piku?</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* --------------------
       Basic reset & layout
    ---------------------*/
    :root{
      --bg1: #fff5f7;
      --bg2: #ffeef2;
      --accent: #ff6b92;
      --accent-deep: #ff2e63;
      --muted: #f8c8d8;
      --card-bg: rgba(255,255,255,0.85);
      --glass: rgba(255,255,255,0.7);
      --shadow: 0 8px 30px rgba(200,50,80,0.12);
    }
    html,body{height:100%;}
    body{
      margin:0;
      font-family: 'Montserrat', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
      background: linear-gradient(135deg,var(--bg1),var(--bg2));
      color:#6b1236;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><text x="16" y="22" font-size="20" text-anchor="middle">❤</text></svg>') 16 16, auto;
      overflow:hidden;
    }

    /* Full-screen centered container */
    .stage{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:2rem;
      position:relative;
    }

    /* Card */
    .card{
      width:100%;
      max-width:720px;
      border-radius:20px;
      background: linear-gradient(180deg,var(--card-bg), rgba(255,255,255,0.9));
      box-shadow: var(--shadow);
      padding:2.2rem;
      text-align:center;
      position:relative;
      backdrop-filter: blur(6px);
    }

    /* Placeholder GIF */
    .gif{
      width:120px;
      height:120px;
      margin:0 auto 1rem auto;
      border-radius:16px;
      overflow:hidden;
      box-shadow: 0 6px 18px rgba(200,30,80,0.12);
    }
    .gif img{width:100%;height:100%;object-fit:cover;display:block}

    h1{
      font-size:clamp(1.8rem,4vw,2.8rem);
      margin:0 0 1rem 0;
      letter-spacing:0.5px;
      font-weight:700;
    }
    p.lead{
      margin:0 0 1.6rem 0;
      color:#8b2e4a;
      font-size:1rem;
    }

    /* Buttons */
    .actions{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
    .btn{
      cursor:pointer;
      border:0;
      padding:0.9rem 1.6rem;
      border-radius:999px;
      font-weight:700;
      font-size:1rem;
      transition:transform .18s ease, box-shadow .18s ease, opacity .18s ease;
      box-shadow: 0 6px 18px rgba(200,30,80,0.12);
    }
    .btn:active{transform:translateY(2px)}
    .btn-primary{
      background: linear-gradient(180deg,var(--accent),var(--accent-deep));
      color:white;
    }
    .btn-ghost{
      background:transparent;
      border:2px solid rgba(107,18,54,0.08);
      color:#6b1236;
    }

    /* Hearts background (floating) */
    .hearts{position:absolute;inset:0;pointer-events:none;overflow:hidden}
    .heart{
      position:absolute;bottom:-10%;width:18px;height:18px;
      transform:translateY(0) rotate(-20deg);
      opacity:0.85;
      animation:floatUp linear infinite;
      will-change:transform,opacity;
      filter:drop-shadow(0 8px 12px rgba(200,30,80,0.06));
    }
    .heart:before,.heart:after{
      content:"";position:absolute;left:50%;top:0;width:10px;height:16px;background:#ff6b92;border-radius:10px 10px 0 0;transform-origin:center;}
    .heart:before{transform:translateX(-50%) rotate(-45deg);}
    .heart:after{transform:translateX(-50%) rotate(45deg);}

    @keyframes floatUp{
      0%{transform:translateY(0) scale(1) rotate(-10deg);opacity:0}
      10%{opacity:1}
      100%{transform:translateY(-140vh) scale(.9) rotate(20deg);opacity:0}
    }

    /* Burst hearts/confetti */
    .burst{position:absolute;pointer-events:none}
    .mini{
      position:absolute;width:12px;height:12px;border-radius:3px;background:#ff6b92;opacity:0;transform:scale(.6);
      animation:burst 700ms ease-out forwards;
    }
    @keyframes burst{
      0%{opacity:1;transform:translate(0,0) scale(0.7)}
      100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.05)}
    }

    /* Music toggle */
    .controls{
      display:flex;gap:.6rem;align-items:center;justify-content:center;margin-top:1rem
    }
    .mute{
      background:transparent;border:0;color:#6b1236;padding:.4rem .7rem;border-radius:999px;border:1px solid rgba(107,18,54,0.06)
    }

    /* Responsive tweaks */
    @media (max-width:480px){
      .card{padding:1.4rem;border-radius:16px}
      .gif{width:96px;height:96px}
      h1{font-size:1.6rem}
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="hearts" id="hearts"></div>

    <main class="card" role="main" aria-labelledby="proposal">
      <div class="gif" aria-hidden="true">
        <!-- Inline animated SVG fallback (reliable offline substitute for external GIF) -->
        <svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="animated heart">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ff8bb0"/>
              <stop offset="1" stop-color="#ff2e63"/>
            </linearGradient>
            <filter id="f" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="4" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <g transform="translate(60,60)">
            <path class="heart-shape" d="M0 -18 C 18 -40, 48 -24, 0 26 C -48 -24, -18 -40, 0 -18 Z" fill="url(#g)" filter="url(#f)"/>
            <g class="sparkles" fill="#ffd1e6">
              <circle cx="-30" cy="-40" r="3"/>
              <circle cx="34" cy="-36" r="2"/>
              <circle cx="10" cy="-52" r="2.2"/>
            </g>
          </g>
          <style>
            .heart-shape{transform-origin:60px 60px;animation:beat 1s infinite cubic-bezier(.2,.9,.3,1)}
            @keyframes beat{0%{transform:scale(1)}40%{transform:scale(1.12)}70%{transform:scale(0.95)}100%{transform:scale(1)}}
            .sparkles{animation:rise 2.6s infinite ease-in-out}
            @keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-18px);opacity:0}}
          </style>
        </svg>
      </div>

      <h1 id="proposal">Will you be my Valentine Chiku Piku? 💖</h1>
      <p class="lead" id="message">I made something special just for you — pick an answer 💕</p>

      <div class="actions">
        <button class="btn btn-primary" id="yesBtn">YES ❤️</button>
        <button class="btn btn-ghost" id="noBtn">NO 💔</button>
      </div>

      <div class="controls">
        <button id="musicToggle" class="mute">🔈 Music</button>
        <small style="color:#9a2748;opacity:.9">Muted by default</small>
      </div>
    </main>
  </div>

  <!-- Background music (muted default) -->
  <audio id="bgm" loop preload="auto" src="https://cdn.pixabay.com/download/audio/2021/09/03/audio_6df4b7ecdd.mp3?filename=relaxed-ambient-11003.mp3"></audio>

  <script>
    /* -----------------------------
       Utilities & initial setup
    ------------------------------*/
    const heartsContainer = document.getElementById('hearts');
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    const message = document.getElementById('message');
    const heading = document.getElementById('proposal');
    const bgm = document.getElementById('bgm');
    const musicToggle = document.getElementById('musicToggle');

    // Generate floating hearts in the background
    function createFloatingHearts(count = 18){
      for(let i=0;i<count;i++){
        const h = document.createElement('div');
        h.className = 'heart';
        // random horizontal pos and size/delay/speed
        const left = Math.random()*100;
        const size = 10 + Math.random()*22; // px
        const dur = 8 + Math.random()*12; // seconds
        const delay = -Math.random()*dur;
        h.style.left = left + '%';
        h.style.width = size + 'px';
        h.style.height = size + 'px';
        h.style.animationDuration = dur + 's';
        h.style.animationDelay = delay + 's';
        h.style.opacity = 0.6 + Math.random()*0.4;
        heartsContainer.appendChild(h);
      }
    }

    createFloatingHearts(20);

    /* -------------------------------
       YES button: success animation
    --------------------------------*/
    function burstAt(x,y){
      // Create many small elements that fly out
      const wrap = document.createElement('div');
      wrap.className = 'burst';
      wrap.style.left = x + 'px';
      wrap.style.top = y + 'px';
      document.body.appendChild(wrap);

      const colors = ['#ff8bb0','#ff2e63','#ffd1e6','#ff6b92','#ffd6e0'];
      const pieces = 28;
      for(let i=0;i<pieces;i++){
        const el = document.createElement('div');
        el.className='mini';
        // random direction
        const ang = (Math.random()*Math.PI*2);
        const dist = 40 + Math.random()*120;
        const dx = Math.cos(ang)*dist + 'px';
        const dy = Math.sin(ang)*dist + 'px';
        el.style.setProperty('--x', dx);
        el.style.setProperty('--y', dy);
        el.style.background = colors[i % colors.length];
        el.style.left = '0px';
        el.style.top = '0px';
        el.style.width = (6 + Math.random()*10) + 'px';
        el.style.height = (6 + Math.random()*10) + 'px';
        el.style.borderRadius = Math.random()>0.6? '50%':'3px';
        wrap.appendChild(el);
      }

      // remove after animation
      setTimeout(()=>wrap.remove(),900);
    }

    yesBtn.addEventListener('click', (ev)=>{
      // change text and show burst near button
      heading.textContent = 'Yay! I knew you\'d say yes 💕';
      message.textContent = 'My heart is so happy — let\'s celebrate!';

      // center of the yes button
      const rect = yesBtn.getBoundingClientRect();
      const x = rect.left + rect.width/2;
      const y = rect.top + rect.height/2;
      // two bursts for extra joy
      burstAt(x,y);
      setTimeout(()=>burstAt(x,y),120);

      // small pulse on the button
      yesBtn.animate([
        {transform:'scale(1)'},
        {transform:'scale(1.08)'},
        {transform:'scale(1)'}
      ],{duration:420,easing:'ease-out'});

      // optionally play a short chime when music is off
      if(bgm.paused){
        const t = new Audio('https://cdn.pixabay.com/download/audio/2021/08/08/audio_e0efe2b61c.mp3?filename=cartoon-pop-6305.mp3');
        t.volume = 0.9; t.play();
      }
    });

    /* ---------------------------------
       NO button: playful evasion logic
    ----------------------------------*/
    // Keep track of how many times hovered to shrink
    let noHoverCount = 0;

    function moveNoButtonAway(ev){
      noHoverCount++;
      const container = document.querySelector('.stage');
      const contRect = container.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();

      // choose new random position within the card bounds
      const padding = 24;
      const maxX = contRect.width - btnRect.width - padding;
      const maxY = contRect.height - btnRect.height - padding;
      const newX = Math.random()*maxX + padding/2;
      const newY = Math.random()*maxY + padding/2;

      // translate relative to center of card
      const card = document.querySelector('.card');
      const cardRect = card.getBoundingClientRect();
      // compute transform to position the button absolute inside card
      const relX = newX - (btnRect.left - cardRect.left);
      const relY = newY - (btnRect.top - cardRect.top);

      // animate using transform
      noBtn.style.transition = 'transform 340ms cubic-bezier(.2,.9,.2,1)';
      const shrink = Math.max(0.6, 1 - noHoverCount*0.05);
      noBtn.style.transform = `translate(${relX}px, ${relY}px) scale(${shrink})`;

      // if user somehow clicks, keep moving
      setTimeout(()=>{ noBtn.style.transition=''; },400);
    }

    noBtn.addEventListener('mouseenter', moveNoButtonAway);
    noBtn.addEventListener('click', (e)=>{ e.preventDefault(); moveNoButtonAway(); });
    // touch devices: move on touchstart
    noBtn.addEventListener('touchstart', (e)=>{ e.preventDefault(); moveNoButtonAway(); });

    /* -----------------------------
       Music toggle
    ------------------------------*/
    musicToggle.addEventListener('click', ()=>{
      if(bgm.paused){
        bgm.muted = false;
        bgm.play();
        musicToggle.textContent = '🔊 Playing';
      } else {
        bgm.pause();
        musicToggle.textContent = '🔈 Music';
      }
    });

    // Keep audio muted by default until user toggles
    bgm.muted = true;

    /* Accessibility: keyboard support for YES/NO */
    yesBtn.addEventListener('keyup', (e)=>{ if(e.key==='Enter' || e.key===' ') yesBtn.click(); });
    noBtn.addEventListener('keyup', (e)=>{ if(e.key==='Enter' || e.key===' ') noBtn.click(); });

    /* Small enhancement: click anywhere near card to spawn tiny hearts */
    document.querySelector('.card').addEventListener('click',(ev)=>{
      const r = ev.currentTarget.getBoundingClientRect();
      burstAt(ev.clientX, ev.clientY);
    });

    // Prevent NO button from being easily tabbable (playful)
    noBtn.setAttribute('tabindex','-1');

  </script>
</body>
</html>
